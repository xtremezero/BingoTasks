<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Bingo Tasks 5x5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Cache control tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=1.1">
  <script defer src="script.js?v=1.1"></script>
</head>

<body>
  <h2>Bingo Tasks 5x5</h2>
  <p style="margin-top: -20px; margin-bottom: 20px; text-align: center; color: #666;">Long Term Tasks and Rewards Tracker</p>

  <div style="margin-bottom: 20px;">
    <button onclick="exportData()">Export Data</button>
    <input type="file" id="importFile" accept=".json" style="display:none" />
    <button onclick="document.getElementById('importFile').click()">Import Data</button>
  </div>
  
  <p style="margin-bottom: 20px; text-align: center; color: #555; background: #e8f5e9; padding: 10px; border-radius: 8px; max-width: 90%; width: 600px;">
    Tap or LeftClick to complete a task or Reward, Hold or RightClick to Edit it
  </p>

  <table id="cardTable"></table>
</body>

</html>
